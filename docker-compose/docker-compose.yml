name: api-file-share

services:

  mysql:
    image: mysql:latest
    container_name: api-file-share-mysql
    environment:
      MYSQL_ROOT_PASSWORD: helios
      MYSQL_DATABASE: files
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - api-file-share

  rabbitmq:
    image: rabbitmq:management
    container_name: api-file-share-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: api-file-share
      RABBITMQ_DEFAULT_PASS: api-file-share
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - api-file-share

  redis:
    image: valkey/valkey:latest
    container_name: api-file-share-redis
    ports:
      - "6379:6379"
    networks:
      - api-file-share

networks:
  api-file-share:
    driver: bridge

volumes:
  mysql_data:
