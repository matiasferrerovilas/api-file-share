plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.orm' version '7.4.1.Final'
	id 'org.graalvm.buildtools.native' version '1.1.1'
	id 'checkstyle'
	id 'jacoco'
}

group = 'com.api.file.share'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}
repositories {
	mavenCentral()
}
checkstyle {
	configFile = file("$rootDir/checkstyle/checkstyle.xml")
	toolVersion = "12.1.2"
}

checkstyleMain {
	source = 'src/main/java'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

hibernate {
	enhancement {
	}
}

jar {
	enabled = false
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += [
			'-parameters',
			'-Xlint:unchecked',
			'-Xlint:deprecation'
	]
}


checkstyle {
	configFile = file("$rootDir/checkstyle/checkstyle.xml")
	toolVersion = "12.1.2"
}

checkstyleMain {
	source = 'src/main/java'
}

test {
	finalizedBy jacocoTestReport
}

tasks.named('test') {
	useJUnitPlatform()

	// Configuración de encoding
	systemProperty 'file.encoding', 'UTF-8'

	// Performance
	// Los tests de integración levantan un contenedor MySQL + contexto Spring completo
	// por fork (el @Shared static container no se comparte entre JVMs distintas).
	// Con cores/2 en máquinas de muchos cores esto multiplica contenedores y satura RAM/disco.
	maxParallelForks = Math.min(2, Runtime.runtime.availableProcessors().intdiv(2) ?: 1)

	// Logging mejorado
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
		showStandardStreams = false
		showCauses = true
		showStackTraces = true
	}
}
tasks.register("printVersion") {
	doLast {
		println(project.version.toString().trim())
	}
}
tasks.withType(Test).configureEach {
	reports.html.required = false
	reports.junitXml.required = true
}

springBoot {
	buildInfo()
}